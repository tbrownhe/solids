services:
  studio:
    build: .
    ports:
      - "127.0.0.1:8081:8000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 2
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
